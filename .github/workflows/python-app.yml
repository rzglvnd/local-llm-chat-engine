name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          flake8 .
      - name: Run tests
        run: |
          pytest -q

  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install SDK contract dependencies
        run: python -m pip install -r requirements-sdk-contract.txt
      - name: Report SDK and transport versions
        run: python -c "import openai, httpx2; print('openai', openai.__version__, 'httpx2', httpx2.__version__)"
      - name: Run offline SDK contract tests
        run: python -m pytest -q tests/sdk_contract
